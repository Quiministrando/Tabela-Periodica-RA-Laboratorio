<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden; background:#000;">

  <div id="status"
       style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;
       background:rgba(0,0,0,.78);color:#fff;border:2px solid #fff;border-radius:10px;
       padding:9px 14px;font:700 14px Arial,sans-serif;text-align:center;">
    V2 Laboratório — aponte para o barcode 11 (Sódio)
  </div>

  <div id="legenda"
       style="display:none;position:fixed;left:12px;bottom:12px;z-index:20;
       background:rgba(0,0,0,.82);color:#fff;border:2px solid #fff;border-radius:10px;
       padding:10px 12px;font:700 13px Arial,sans-serif;line-height:1.55;">
      <div style="font-size:15px;margin-bottom:4px;">Sódio — Na — Z = 11</div>
      <div><span style="color:#ff5a5a;">●</span> Próton: 11</div>
      <div><span style="color:#55aaff;">●</span> Nêutron: 12</div>
      <div><span style="color:#ffe066;">●</span> Elétron: 11</div>
      <div style="font-weight:400;margin-top:5px;">Camadas: 2–8–1</div>
      <div style="font-weight:400;">Modelo didático de Bohr.</div>
  </div>

  <script src="elementos.js"></script>

  <script>
    AFRAME.registerComponent("laboratorio-atomico", {
      init: function () {
        var dados = window.ELEMENTOS[0];
        var atom = this.el;

        function esfera(parent, radius, color, x, y, z) {
          var e = document.createElement("a-sphere");
          e.setAttribute("radius", radius);
          e.setAttribute("color", color);
          e.setAttribute("position", x + " " + y + " " + z);
          e.setAttribute("segments-width", "16");
          e.setAttribute("segments-height", "12");
          parent.appendChild(e);
          return e;
        }

        var nucleo = document.createElement("a-entity");
        nucleo.setAttribute("id", "nucleo");
        atom.appendChild(nucleo);

        var total = dados.protons + dados.neutrons;
        var raioCluster = 0.24;
        var raioNucleon = 0.078;
        var golden = Math.PI * (3 - Math.sqrt(5));

        for (var i = 0; i < total; i++) {
          var y = 1 - (i / Math.max(1, total - 1)) * 2;
          var r = Math.sqrt(Math.max(0, 1 - y*y));
          var theta = golden * i;

          var x = Math.cos(theta) * r * raioCluster;
          var yy = y * raioCluster;
          var z = Math.sin(theta) * r * raioCluster;

          var cor = i < dados.protons ? "#ff5a5a" : "#55aaff";
          esfera(nucleo, raioNucleon, cor, x, yy, z);
        }

        var raios = [0.45, 0.72, 1.00];
        var inclinacoes = [
          {x:0,  y:0,  z:0},
          {x:62, y:0,  z:24},
          {x:28, y:54, z:0}
        ];

        dados.camadas.forEach(function(qtd, camadaIndex) {
          var shell = document.createElement("a-entity");
          shell.setAttribute("rotation",
            inclinacoes[camadaIndex].x + " " +
            inclinacoes[camadaIndex].y + " " +
            inclinacoes[camadaIndex].z
          );
          atom.appendChild(shell);

          var ring = document.createElement("a-torus");
          ring.setAttribute("radius", raios[camadaIndex]);
          ring.setAttribute("radius-tubular", "0.008");
          ring.setAttribute("segments-radial", "64");
          ring.setAttribute("segments-tubular", "8");
          ring.setAttribute("color", "#ffffff");
          ring.setAttribute("opacity", "0.72");
          shell.appendChild(ring);

          for (var j = 0; j < qtd; j++) {
            var a = (Math.PI * 2 * j / qtd) + camadaIndex * 0.37;
            var ex = Math.cos(a) * raios[camadaIndex];
            var ey = Math.sin(a) * raios[camadaIndex];
            esfera(shell, 0.055, "#ffe066", ex, ey, 0);
          }
        });
      }
    });

    AFRAME.registerComponent("controle-marcador-na", {
      init: function () {
        var marker = this.el;
        var viewer = document.querySelector("#viewer");
        var status = document.querySelector("#status");
        var legenda = document.querySelector("#legenda");

        marker.addEventListener("markerFound", function () {
          viewer.setAttribute("visible", true);
          legenda.style.display = "block";
          status.textContent = "Sódio identificado — modelo dinâmico ativo";
        });

        marker.addEventListener("markerLost", function () {
          status.textContent = "Sódio mantido na tela — barcode pode sair da câmera";
        });
      }
    });
  </script>

  <a-scene
    vr-mode-ui="enabled:false;"
    loading-screen="enabled:false;"
    renderer="logarithmicDepthBuffer:true;"
    arjs="trackingMethod:best; sourceType:webcam; detectionMode:mono_and_matrix; matrixCodeType:4x4_BCH_13_9_3; debugUIEnabled:false;"
    embedded>

    <a-marker
      type="barcode"
      value="11"
      smooth="true"
      smooth-count="5"
      smooth-tolerance="0.01"
      smooth-threshold="2"
      controle-marcador-na>
    </a-marker>

    <a-entity camera>
      <a-entity
        id="viewer"
        visible="false"
        position="0 0 -2.5"
        scale="0.72 0.72 0.72">

        <a-entity laboratorio-atomico></a-entity>

        <a-text
          value="SODIO | Na | Z=11"
          align="center"
          color="#ffffff"
          width="4.5"
          position="0 1.28 0">
        </a-text>

      </a-entity>
    </a-entity>
  </a-scene>

</body>
</html>
