<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden; background:#000;">

  <div id="status"
       style="
         position:fixed;
         top:12px;
         left:50%;
         transform:translateX(-50%);
         z-index:20;
         background:rgba(0,0,0,.78);
         color:#fff;
         border:2px solid #fff;
         border-radius:10px;
         padding:9px 14px;
         font:700 14px Arial,sans-serif;
         text-align:center;">
    V2 Laboratório — aponte para o barcode 11 (Sódio)
  </div>

  <div id="legenda"
       style="
         display:none;
         position:fixed;
         left:12px;
         bottom:12px;
         z-index:20;
         background:rgba(0,0,0,.82);
         color:#fff;
         border:2px solid #fff;
         border-radius:10px;
         padding:10px 12px;
         font:700 13px Arial,sans-serif;
         line-height:1.55;">
      <div style="font-size:15px; margin-bottom:4px;">Sódio — Na — Z = 11</div>
      <div><span style="color:#ff5a5a;">●</span> Próton: 11</div>
      <div><span style="color:#55aaff;">●</span> Nêutron: 12</div>
      <div><span style="color:#ffe066;">●</span> Elétron: 11</div>
      <div style="font-weight:400; margin-top:5px;">Camadas: 2–8–1</div>
      <div style="font-weight:400;">Modelo didático de Bohr.</div>
  </div>

  <script src="elementos.js"></script>

  <script>
    AFRAME.registerComponent("laboratorio-atomico", {
      init: function () {
        var dados = window.ELEMENTOS[0];
        var atom = this.el;

        function esfera(parent, radius, color, x, y, z) {
          var e = document.createElement("a-sphere");
          e.setAttribute("radius", radius);
          e.setAttribute("color", color);
          e.setAttribute("position", x + " " + y + " " + z);
          e.setAttribute("segments-width", "20");
          e.setAttribute("segments-height", "16");
          parent.appendChild(e);
          return e;
        }

        // =====================================================
        // NÚCLEO — permanece parado no centro
        // =====================================================
        var nucleo = document.createElement("a-entity");
        nucleo.setAttribute("id", "nucleo");
        atom.appendChild(nucleo);

        var total = dados.protons + dados.neutrons;
        var raioCluster = 0.24;
        var raioNucleon = 0.078;
        var golden = Math.PI * (3 - Math.sqrt(5));

        for (var i = 0; i < total; i++) {
          var y = 1 - (i / Math.max(1, total - 1)) * 2;
          var r = Math.sqrt(Math.max(0, 1 - y*y));
          var theta = golden * i;

          var x = Math.cos(theta) * r * raioCluster;
          var yy = y * raioCluster;
          var z = Math.sin(theta) * r * raioCluster;

          var cor = i < dados.protons ? "#ff5a5a" : "#55aaff";
          esfera(nucleo, raioNucleon, cor, x, yy, z);
        }

        // =====================================================
        // CAMADAS — cada uma em plano e velocidade diferentes
        // =====================================================
        var raios = [0.48, 0.76, 1.05];

        // Inclinações fixas para separar visualmente os planos.
        var inclinacoes = [
          {x: 15, y: 0,  z: 8},
          {x: 68, y: 10, z: 28},
          {x: 38, y: 58, z: -18}
        ];

        // Velocidades/direções diferentes (ms por volta).
        var animacoes = [
          {dur: 6500,  sentido:  1},
          {dur: 9200,  sentido: -1},
          {dur: 12200, sentido:  1}
        ];

        dados.camadas.forEach(function(qtd, camadaIndex) {

          // Entidade 1: fixa a inclinação do plano orbital.
          var tilt = document.createElement("a-entity");
          tilt.setAttribute(
            "rotation",
            inclinacoes[camadaIndex].x + " " +
            inclinacoes[camadaIndex].y + " " +
            inclinacoes[camadaIndex].z
          );
          atom.appendChild(tilt);

          // Entidade 2: gira dentro do plano inclinado.
          var rotor = document.createElement("a-entity");
          var finalZ = 360 * animacoes[camadaIndex].sentido;

          rotor.setAttribute(
            "animation",
            "property: rotation; " +
            "from: 0 0 0; " +
            "to: 0 0 " + finalZ + "; " +
            "dur: " + animacoes[camadaIndex].dur + "; " +
            "loop: true; " +
            "easing: linear"
          );
          tilt.appendChild(rotor);

          // Torus com maior resolução — órbita mais arredondada.
          var ring = document.createElement("a-entity");
          ring.setAttribute(
            "geometry",
            "primitive: torus; " +
            "radius: " + raios[camadaIndex] + "; " +
            "radiusTubular: 0.009; " +
            "segmentsRadial: 96; " +
            "segmentsTubular: 16"
          );
          ring.setAttribute(
            "material",
            "color: #ffffff; opacity: 0.62; transparent: true; metalness: 0.05; roughness: 0.35"
          );
          rotor.appendChild(ring);

          // Elétrons presos ao mesmo rotor da camada.
          for (var j = 0; j < qtd; j++) {
            var a = (Math.PI * 2 * j / qtd) + camadaIndex * 0.37;
            var ex = Math.cos(a) * raios[camadaIndex];
            var ey = Math.sin(a) * raios[camadaIndex];

            var eletron = esfera(rotor, 0.058, "#ffe066", ex, ey, 0);

            // Pequeno emissive para destacar sobre a câmera real.
            eletron.setAttribute(
              "material",
              "color: #ffe066; emissive: #8a7300; emissiveIntensity: 0.28; roughness: 0.25"
            );
          }
        });
      }
    });

    AFRAME.registerComponent("controle-marcador-na", {
      init: function () {
        var marker = this.el;
        var viewer = document.querySelector("#viewer");
        var status = document.querySelector("#status");
        var legenda = document.querySelector("#legenda");

        marker.addEventListener("markerFound", function () {
          viewer.setAttribute("visible", true);
          legenda.style.display = "block";
          status.textContent = "Sódio identificado — camadas em rotação";
        });

        marker.addEventListener("markerLost", function () {
          // Mantém o átomo visível após perder o barcode.
          status.textContent = "Sódio mantido na tela — camadas continuam girando";
        });
      }
    });
  </script>

  <a-scene
    vr-mode-ui="enabled:false;"
    loading-screen="enabled:false;"
    renderer="logarithmicDepthBuffer:true;"
    arjs="trackingMethod:best; sourceType:webcam; detectionMode:mono_and_matrix; matrixCodeType:4x4_BCH_13_9_3; debugUIEnabled:false;"
    embedded>

    <a-marker
      type="barcode"
      value="11"
      smooth="true"
      smooth-count="5"
      smooth-tolerance="0.01"
      smooth-threshold="2"
      controle-marcador-na>
    </a-marker>

    <a-entity camera>
      <a-entity
        id="viewer"
        visible="false"
        position="0 0 -2.5"
        scale="0.72 0.72 0.72">

        <a-entity laboratorio-atomico></a-entity>

        <a-text
          value="SODIO | Na | Z=11"
          align="center"
          color="#ffffff"
          width="4.5"
          position="0 1.35 0">
        </a-text>

      </a-entity>
    </a-entity>
  </a-scene>

</body>
</html>
