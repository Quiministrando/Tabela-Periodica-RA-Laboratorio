<script>
AFRAME.registerComponent("persistent-gesture-handler", {
    schema: {
        enabled:{default:true},
        rotationFactor:{default:5},
        minScale:{default:0.3},
        maxScale:{default:8}
    },

    init:function(){
        this.handleRotation=this.handleRotation.bind(this);
        this.handleScale=this.handleScale.bind(this);
        this.initialScale=this.el.object3D.scale.clone();
        this.scaleFactor=1;

        this.el.sceneEl.addEventListener("onefingermove",this.handleRotation);
        this.el.sceneEl.addEventListener("twofingermove",this.handleScale);
    },

    remove:function(){
        this.el.sceneEl.removeEventListener("onefingermove",this.handleRotation);
        this.el.sceneEl.removeEventListener("twofingermove",this.handleScale);
    },

    handleRotation:function(event){
        if(!this.data.enabled)return;

        this.el.object3D.rotation.y +=
            event.detail.positionChange.x*this.data.rotationFactor;

        this.el.object3D.rotation.x +=
            event.detail.positionChange.y*this.data.rotationFactor;
    },

    handleScale:function(event){
        if(!this.data.enabled || !event.detail.startSpread)return;

        this.scaleFactor *=
            1 + event.detail.spreadChange/event.detail.startSpread;

        this.scaleFactor = Math.min(
            Math.max(this.scaleFactor,this.data.minScale),
            this.data.maxScale
        );

        this.el.object3D.scale.set(
            this.initialScale.x*this.scaleFactor,
            this.initialScale.y*this.scaleFactor,
            this.initialScale.z*this.scaleFactor
        );
    },

    resetViewer:function(){
        this.scaleFactor=1;
        this.el.object3D.scale.copy(this.initialScale);
        this.el.object3D.rotation.set(0,0,0);
        this.el.object3D.position.set(0,0,-2.5);
    }
});
</script>
</head>

<a-scene
vr-mode-ui="enabled: false;"
loading-screen="enabled: false;"
renderer="logarithmicDepthBuffer: true;"
arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 4x4_BCH_13_9_3;"
id="scene"
embedded
gesture-detector>

<a-assets id="assets-dinamicos"></a-assets>

<a-entity id="camera-ra" camera>
<a-entity
id="viewer"
position="0 0 -2.5"
scale="0.5607348115010105 0.5607348115010105 0.5607348115010105"
rotation="0 0 0"
visible="false"
persistent-gesture-handler>
</a-entity>

<script>
(function(){

var scene=document.getElementById("scene");
var viewer=document.getElementById("viewer");

var botaoExplorar=document.getElementById("botao-explorar");
var botaoRecentrar=document.getElementById("botao-recentrar");
var botaoFechar=document.getElementById("botao-fechar");
var botaoAudio=document.getElementById("botao-audio");
var botaoCuriosidades=document.getElementById("botao-curiosidades");
var botaoFicha=document.getElementById("botao-ficha");

var menu=document.getElementById("menu-elemento");
var telaPrincipal=document.getElementById("tela-principal");
var telaCuriosidades=document.getElementById("tela-curiosidades");
var telaFicha=document.getElementById("tela-ficha");

var fecharCuriosidades=document.getElementById("fechar-curiosidades");
var voltarCuriosidades=document.getElementById("voltar-curiosidades");
var fecharFicha=document.getElementById("fechar-ficha");
var voltarFicha=document.getElementById("voltar-ficha");

var listaCuriosidades=document.getElementById("lista-curiosidades");
var tituloCuriosidades=document.getElementById("titulo-curiosidades");
var blocoPergunta=document.getElementById("bloco-pergunta");
var perguntaObservacao=document.getElementById("pergunta-observacao");

var tituloFicha=document.getElementById("titulo-ficha");
var conteudoFicha=document.getElementById("conteudo-ficha");

var avisoSelecao=document.getElementById("aviso-selecao");

var nome=document.getElementById("nome-elemento");
var linha1=document.getElementById("linha-1");
var linha2=document.getElementById("linha-2");
var linha3=document.getElementById("linha-3");
var linha4=document.getElementById("linha-4");
var linha5=document.getElementById("linha-5");

var elementoAtual=null;
var modeloAtivo=null;
var tokenModelo=0;
var timerAviso=null;

var audioPlayer=new Audio();
audioPlayer.preload="none";

function definirBotao(botao, disponivel, ativo, inativo){
    botao.disabled=!disponivel;
    botao.textContent=disponivel?ativo:inativo;

    if(disponivel){
        botao.style.background="white";
        botao.style.color="black";
    }else{
        botao.style.background="rgba(255,255,255,.12)";
        botao.style.color="rgba(255,255,255,.70)";
    }
}

function preencherDados(e){

    elementoAtual=e;

    nome.innerHTML=e.nome+" — "+e.simbolo;

    linha1.innerHTML=
        "<strong>Número atômico:</strong> "+e.numeroAtomico+
        " &nbsp;•&nbsp; <strong>Grupo:</strong> "+e.grupo+
        " &nbsp;•&nbsp; <strong>Período:</strong> "+e.periodo;

    linha2.innerHTML=
        "<strong>"+e.familia+"</strong>"+
        " &nbsp;•&nbsp; <strong>Estado:</strong> "+e.estado;

    linha3.innerHTML=
        "<strong>Distribuição eletrônica:</strong> "+e.distribuicao;

    linha4.innerHTML=
        "<strong>Configuração:</strong> "+e.configuracao;

    linha5.innerHTML=
        "<strong>"+e.valencia+"</strong>"+
        " &nbsp;•&nbsp; <strong>Íon mais comum:</strong> "+e.ion;

    botaoExplorar.innerHTML="☰ Explorar "+e.simbolo;

    definirBotao(
        botaoCuriosidades,
        !!(e.curiosidades&&e.curiosidades.length),
        "💡 Curiosidades",
        "💡 Curiosidades — em breve"
    );

    definirBotao(
        botaoFicha,
        !!e.ficha,
        "📋 Ficha completa",
        "📋 Ficha completa — em breve"
    );
}

function mostrarAviso(e){
    avisoSelecao.textContent="✓ "+e.nome+" ("+e.simbolo+") selecionado";
    avisoSelecao.style.display="block";

    if(timerAviso)clearTimeout(timerAviso);

    timerAviso=setTimeout(function(){
        avisoSelecao.style.display="none";
    },1300);
}

function resetViewer(){
    var comp=viewer.components["persistent-gesture-handler"];
    if(comp&&comp.resetViewer)comp.resetViewer();
}

function removerModeloAtivo(){
    if(modeloAtivo && modeloAtivo.parentNode===viewer){
        viewer.removeChild(modeloAtivo);
    }
    modeloAtivo=null;
}

function carregarModeloElemento(e){

    if(modeloAtivo && modeloAtivo.dataset.elemento===e.id){
        viewer.setAttribute("visible","true");
        modeloAtivo.setAttribute("visible","true");
        resetViewer();
        return;
    }

    tokenModelo++;
    var meuToken=tokenModelo;

    removerModeloAtivo();
    viewer.setAttribute("visible","false");

    var modelo=document.createElement("a-entity");
    modelo.setAttribute("id","modelo-ativo");
    modelo.setAttribute("visible","false");
    modelo.setAttribute("gltf-model",e.modelo);
    modelo.dataset.elemento=e.id;

    modelo.addEventListener("model-loaded",function(){

        if(meuToken!==tokenModelo)return;
        if(!elementoAtual || elementoAtual.id!==e.id)return;

        modelo.setAttribute("visible","true");
        viewer.setAttribute("visible","true");
        resetViewer();
    });

    modelo.addEventListener("model-error",function(){
        if(meuToken!==tokenModelo)return;
        console.error("Erro ao carregar modelo:",e.modelo);
        viewer.setAttribute("visible","false");
    });

    viewer.appendChild(modelo);
    modeloAtivo=modelo;
}

function selecionarElemento(e){

    if(!audioPlayer.paused)audioPlayer.pause();

    audioPlayer.currentTime=0;
    audioPlayer.removeAttribute("src");
    audioPlayer.removeAttribute("data-elemento");
    audioPlayer.load();

    botaoAudio.textContent="🔊 Ouvir descrição";

    preencherDados(e);

    /*
      Carrega somente o GLB do elemento reconhecido.
      Evita manter dezenas de modelos 3D na memória do celular.
    */
    carregarModeloElemento(e);

    telaPrincipal.style.display="block";
    telaCuriosidades.style.display="none";
    telaFicha.style.display="none";
    menu.style.display="none";

    botaoExplorar.style.display="block";
    botaoRecentrar.style.display="block";

    mostrarAviso(e);
}

/* ÁUDIO */
botaoAudio.addEventListener("click",function(){

    if(!elementoAtual||!elementoAtual.audio)return;

    if(!audioPlayer.paused&&!audioPlayer.ended){
        audioPlayer.pause();
        botaoAudio.textContent="▶ Continuar descrição";
        return;
    }

    if(!audioPlayer.src||audioPlayer.dataset.elemento!==elementoAtual.id){
        audioPlayer.src=elementoAtual.audio;
        audioPlayer.dataset.elemento=elementoAtual.id;
        audioPlayer.load();
    }

    audioPlayer.play().then(function(){
        botaoAudio.textContent="⏸ Pausar descrição";
    }).catch(function(){
        botaoAudio.textContent="🔇 Áudio ainda não disponível";
    });
});

audioPlayer.addEventListener("ended",function(){
    botaoAudio.textContent="🔊 Ouvir descrição";
});

audioPlayer.addEventListener("error",function(){
    botaoAudio.textContent="🔇 Áudio ainda não disponível";
});

/* CURIOSIDADES */
botaoCuriosidades.addEventListener("click",function(){

    if(!elementoAtual||!elementoAtual.curiosidades)return;

    listaCuriosidades.innerHTML="";
    tituloCuriosidades.textContent=
        "💡 Curiosidades sobre "+elementoAtual.nome;

    elementoAtual.curiosidades.forEach(function(item){

        var bloco=document.createElement("div");

        bloco.style.marginBottom="12px";
        bloco.style.paddingBottom="10px";
        bloco.style.borderBottom=
            "1px solid rgba(255,255,255,.25)";

        bloco.innerHTML=
            '<div style="font-weight:bold;font-size:16px;margin-bottom:3px;">'+
            item.icone+" "+item.titulo+
            '</div><div>'+item.texto+'</div>';

        listaCuriosidades.appendChild(bloco);
    });

    if(elementoAtual.perguntaObservacao){
        perguntaObservacao.textContent=
            elementoAtual.perguntaObservacao;
        blocoPergunta.style.display="block";
    }else{
        blocoPergunta.style.display="none";
    }

    telaPrincipal.style.display="none";
    telaCuriosidades.style.display="block";
});

voltarCuriosidades.addEventListener("click",function(){
    telaCuriosidades.style.display="none";
    telaPrincipal.style.display="block";
});

fecharCuriosidades.addEventListener("click",function(){
    telaCuriosidades.style.display="none";
    telaPrincipal.style.display="block";
    menu.style.display="none";

    botaoExplorar.style.display="block";
    botaoRecentrar.style.display="block";
});

/* FICHA COMPLETA */
botaoFicha.addEventListener("click",function(){

    if(!elementoAtual||!elementoAtual.ficha)return;

    var f=elementoAtual.ficha;

    tituloFicha.textContent=
        "📋 Ficha completa — "+elementoAtual.nome;

    conteudoFicha.innerHTML=
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Número atômico (Z)</strong><br>'+elementoAtual.numeroAtomico+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Número de massa (A)</strong><br>'+f.numeroMassa+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Prótons</strong><br>'+f.protons+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Elétrons</strong><br>'+f.eletrons+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Nêutrons</strong><br>'+f.neutrons+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Massa atômica</strong><br>'+f.massaAtomica+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Grupo</strong><br>'+f.grupo+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Período</strong><br>'+f.periodo+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Camadas ocupadas</strong><br>'+f.camadas+
        '</div>'+

        '<div style="padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Bloco</strong><br>'+f.bloco+
        '</div>'+

        '</div>'+

        '<div style="margin-top:10px;padding:10px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Distribuição por camadas</strong><br>'+f.distribuicaoCamadas+
        '</div>'+

        '<div style="margin-top:8px;padding:10px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Configuração eletrônica completa</strong><br>'+f.configuracaoCompleta+
        '</div>'+

        '<div style="margin-top:8px;padding:10px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Configuração eletrônica condensada</strong><br>'+f.configuracaoCondensada+
        '</div>'+

        '<div style="margin-top:8px;padding:10px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Elétrons de valência</strong><br>'+f.eletronsValencia+
        '</div>'+

        '<div style="margin-top:8px;padding:10px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Classificação</strong><br>'+f.classificacao+
        ' • '+f.estado+
        '</div>'+

        '<div style="margin-top:8px;padding:10px;border:1px solid rgba(255,255,255,.35);border-radius:8px;">'+
        '<strong>Íon mais comum</strong><br>'+f.ionComum+
        '</div>'+

        '<div style="margin-top:12px;padding:10px;border-radius:8px;background:rgba(255,255,255,.10);font-size:13px;">'+
        '<strong>ℹ️ Sobre massa e número de massa</strong><br>'+
        f.observacaoMassa+
        '</div>';

    telaPrincipal.style.display="none";
    telaFicha.style.display="block";
});

voltarFicha.addEventListener("click",function(){
    telaFicha.style.display="none";
    telaPrincipal.style.display="block";
});

fecharFicha.addEventListener("click",function(){
    telaFicha.style.display="none";
    telaPrincipal.style.display="block";
    menu.style.display="none";

    botaoExplorar.style.display="block";
    botaoRecentrar.style.display="block";
});

/* MENU */
botaoExplorar.addEventListener("click",function(){

    if(!elementoAtual)return;

    botaoExplorar.style.display="none";
    botaoRecentrar.style.display="none";

    telaPrincipal.style.display="block";
    telaCuriosidades.style.display="none";
    telaFicha.style.display="none";

    menu.style.display="block";
});

botaoFechar.addEventListener("click",function(){

    menu.style.display="none";

    if(elementoAtual){
        botaoExplorar.style.display="block";
        botaoRecentrar.style.display="block";
    }
});

botaoRecentrar.addEventListener("click",function(){
    if(elementoAtual)resetViewer();
});

/* MARCADORES
   Os modelos GLB não são mais pré-carregados.
   Só os marcadores são registrados no início.
*/
/*
   SISTEMA OFICIAL DE BARCODE/MATRIX MARKERS.
   Todos os elementos cadastrados entre Z=1 e Z=118 podem ficar
   ativos simultaneamente.

   Regra geral: valor do barcode = número atômico.
   Exceção técnica já validada: Carbono (Z=6) usa barcode 206.
   Não há arquivos .patt nesta arquitetura.
*/
window.ELEMENTOS
.filter(function(e){
    var z=Number(e.numeroAtomico);
    return z>=1 && z<=118;
})
.forEach(function(e){

    var marker=document.createElement("a-marker");
    /*
       O número atômico continua sendo o identificador químico.
       Exceção técnica: Carbono (Z=6) usa o barcode 206 porque
       o marcador de valor 6 apresentou falha de reconhecimento
       no teste real do celular.
    */
    var barcodeId = Number(e.numeroAtomico)===6 ? 206 : Number(e.numeroAtomico);

    marker.setAttribute("id","barcode-"+e.numeroAtomico);
    marker.setAttribute("type","barcode");
    marker.setAttribute("value",String(barcodeId));
    marker.setAttribute("emitevents","true");

    scene.appendChild(marker);

    marker.addEventListener("markerFound",function(){
        selecionarElemento(e);
    });
});

})();
</script>
