  <script>
    var TOAST_TIMER = null;

    function mostrarToast(texto, duracao) {
      var toast = document.querySelector("#toast");

      toast.textContent = texto;
      toast.style.display = "block";

      if (TOAST_TIMER) {
        clearTimeout(TOAST_TIMER);
      }

      TOAST_TIMER = setTimeout(function () {
        toast.style.display = "none";
      }, duracao || 1450);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function porId(id) {
      for (var i = 0; i < window.ELEMENTOS.length; i++) {
        if (window.ELEMENTOS[i].id === id) {
          return window.ELEMENTOS[i];
        }
      }
      return null;
    }

    function cargaTexto(carga) {
      if (carga === 0) return "0";
      return (carga > 0 ? "+" : "−") + Math.abs(carga);
    }

    // -----------------------------------------------------------------
    // Gestos: 1 dedo gira; pinça dá zoom.
    // Em comparação, o mesmo gesto atua sobre os dois átomos.
    // -----------------------------------------------------------------
    AFRAME.registerComponent("gestos-laboratorio", {
      init: function () {
        var scene = this.el;

        scene.addEventListener("renderstart", function () {
          var canvas = scene.canvas;

          if (!canvas || canvas.__gestosV2) return;
          canvas.__gestosV2 = true;

          var ultimoX = 0;
          var ultimoY = 0;
          var distanciaAnterior = 0;

          function distancia(t1, t2) {
            var dx = t2.clientX - t1.clientX;
            var dy = t2.clientY - t1.clientY;
            return Math.sqrt(dx*dx + dy*dy);
          }

          canvas.addEventListener("touchstart", function (ev) {
            if (!window.LAB_V2) return;

            if (ev.touches.length === 1) {
              ultimoX = ev.touches[0].clientX;
              ultimoY = ev.touches[0].clientY;
            }

            if (ev.touches.length === 2) {
              distanciaAnterior = distancia(
                ev.touches[0],
                ev.touches[1]
              );
            }
          }, {passive:false});

          canvas.addEventListener("touchmove", function (ev) {
            if (!window.LAB_V2) return;

            if (ev.touches.length === 1) {
              ev.preventDefault();

              var x = ev.touches[0].clientX;
              var y = ev.touches[0].clientY;

              var dx = x - ultimoX;
              var dy = y - ultimoY;

              ultimoX = x;
              ultimoY = y;

              window.LAB_V2.rotacionarAtivos(
                dx * 0.45,
                dy * 0.45
              );
            }

            if (ev.touches.length === 2) {
              ev.preventDefault();

              var d = distancia(
                ev.touches[0],
                ev.touches[1]
              );

              if (distanciaAnterior > 0) {
                window.LAB_V2.zoomAtivos(
                  d / distanciaAnterior
                );
              }

              distanciaAnterior = d;
            }
          }, {passive:false});

          canvas.addEventListener("touchend", function () {
            distanciaAnterior = 0;
          }, {passive:false});
        });
      }
    });

    // -----------------------------------------------------------------
    // Registra TODOS os marcadores cadastrados.
    // Carbono mantém a exceção barcode 206.
    // -----------------------------------------------------------------
    AFRAME.registerComponent("gerenciador-marcadores", {
      init: function () {
        var scene = this.el;

        window.ELEMENTOS.forEach(function (e) {
          var marker = document.createElement("a-marker");

          marker.setAttribute("type", "barcode");
          marker.setAttribute("value", String(e.barcode));
          marker.setAttribute("smooth", "true");
          marker.setAttribute("smooth-count", "5");
          marker.setAttribute("smooth-tolerance", "0.01");
          marker.setAttribute("smooth-threshold", "2");
          marker.setAttribute(
            "marcador-elemento",
            "id: " + e.id
          );

          scene.appendChild(marker);
        });
      }
    });

    AFRAME.registerComponent("marcador-elemento", {
      schema: {
        id: {type: "string"}
      },

      init: function () {
        var self = this;

        this.el.addEventListener(
          "markerFound",
          function () {
            if (window.LAB_V2) {
              window.LAB_V2.receberMarcador(
                self.data.id
              );
            }
          }
        );
      }
    });

    // -----------------------------------------------------------------
    // Aplicação principal
    // -----------------------------------------------------------------
    AFRAME.registerComponent("laboratorio-v2", {
      init: function () {
        window.LAB_V2 = this;

        this.viewer =
          document.querySelector("#viewer");

        this.currentData = null;
        this.currentVisual = null;

        this.naIsotopoIndex = 1;       // Na-23
        this.cargaAtual = 0;           // 0 = átomo neutro
        this.modoQuimico = null;

        this.modoPlano = false;

        this.comparacao = false;
        this.aguardandoSegundo = false;

        this.primeiroSnapshot = null;
        this.primeiroVisual = null;
        this.segundoVisual = null;

        this.zoomNormal = 0.58;
        this.zoomComparacao = 1;

        this.rotX = 0;
        this.rotY = 0;

        this.ultimoMovimentoEletron = null;
        this.audioAtual = null;

        this.configurarUI();
      },

      // ---------------------------------------------------------------
      // snapshot = estado concreto do átomo naquele momento.
      // ---------------------------------------------------------------
      snapshotPadrao: function (dados) {
        return {
          dados: dados,
          neutrons: dados.neutrons,
          eletrons: dados.eletrons,
          camadas: dados.camadas.slice(),
          numeroMassa: dados.numeroMassa,
          isotopoReferencia: dados.isotopoReferencia,
          carga: dados.protons - dados.eletrons
        };
      },

      ajustarCamadasPorCarga: function (
        camadasBase,
        carga
      ) {
        var camadas =
          camadasBase.slice();

        // carga positiva = perdeu elétrons
        if (carga > 0) {
          var remover = carga;

          while (remover > 0) {
            var i =
              camadas.length - 1;

            while (
              i >= 0 &&
              camadas[i] === 0
            ) {
              i--;
            }

            if (i < 0) break;

            camadas[i]--;
            remover--;
          }

          while (
            camadas.length > 1 &&
            camadas[
              camadas.length - 1
            ] === 0
          ) {
            camadas.pop();
          }
        }

        // carga negativa = ganhou elétrons.
        // Para os ânions comuns da base (O²⁻, Cl⁻ etc.),
        // isso completa a camada mais externa.
        if (carga < 0) {
          var adicionar =
            Math.abs(carga);

          if (!camadas.length) {
            camadas = [0];
          }

          while (adicionar > 0) {
            camadas[
              camadas.length - 1
            ]++;

            adicionar--;
          }
        }

        return camadas;
      },

      faixaCargas: function (
        dados
      ) {
        var comuns =
          (dados.cargasComuns || [])
            .slice();

        comuns.push(0);

        var min = 0;
        var max = 0;

        comuns.forEach(function (c) {
          if (c < min) min = c;
          if (c > max) max = c;
        });

        return {
          min: min,
          max: max,
          comuns: comuns
        };
      },

      cargaEhComum: function (
        dados,
        carga
      ) {
        if (carga === 0) return true;

        return (
          (dados.cargasComuns || [])
            .indexOf(carga) >= 0
        );
      },

      simboloIon: function (
        dados,
        carga
      ) {
        if (carga === 0) {
          return dados.simbolo;
        }

        var mag =
          Math.abs(carga);

        var sinal =
          carga > 0 ? "⁺" : "⁻";

        var sup = {
          1:"",
          2:"²",
          3:"³",
          4:"⁴",
          5:"⁵",
          6:"⁶",
          7:"⁷"
        };

        return (
          dados.simbolo +
          (sup[mag] || String(mag)) +
          sinal
        );
      },

      snapshotAtual: function () {
        if (!this.currentData) return null;

        var dados =
          this.currentData;

        var neutrons =
          dados.neutrons;

        var numeroMassa =
          dados.numeroMassa;

        var isotopoReferencia =
          dados.isotopoReferencia;

        if (
          dados.isotopos &&
          this.modoQuimico ===
            "isotopo"
        ) {
          var iso =
            dados.isotopos[
              this.naIsotopoIndex
            ];

          neutrons =
            iso.neutrons;

          numeroMassa =
            iso.massa;

          isotopoReferencia =
            iso.simboloNuclear;
        }

        var eletrons =
          dados.numeroAtomico -
          this.cargaAtual;

        var camadas =
          this.ajustarCamadasPorCarga(
            dados.camadas,
            this.cargaAtual
          );

        return {
          dados: dados,
          neutrons: neutrons,
          eletrons: eletrons,
          camadas: camadas,
          numeroMassa: numeroMassa,
          isotopoReferencia:
            isotopoReferencia,
          carga: this.cargaAtual
        };
      },

      // ---------------------------------------------------------------
      // Renderizador 3D otimizado.
      // Usa InstancedMesh para aguentar elementos pesados melhor.
      // ---------------------------------------------------------------
      criarInstanciasEsfera: function (
        parent,
        positions,
        radius,
        color,
        emissive
      ) {
        if (!positions.length) return null;

        var geo =
          new THREE.SphereGeometry(
            radius,
            12,
            8
          );

        var mat =
          new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.3,
            metalness: 0.02,
            emissive: emissive || 0x000000,
            emissiveIntensity:
              emissive ? 0.20 : 0
          });

        var mesh =
          new THREE.InstancedMesh(
            geo,
            mat,
            positions.length
          );

        var dummy =
          new THREE.Object3D();

        positions.forEach(function (p, i) {
          dummy.position.set(
            p[0],
            p[1],
            p[2]
          );

          dummy.updateMatrix();

          mesh.setMatrixAt(
            i,
            dummy.matrix
          );
        });

        mesh.instanceMatrix.needsUpdate = true;

        parent.object3D.add(mesh);

        return mesh;
      },

      criarNucleo: function (
        snapshot,
        parent
      ) {
        var p =
          snapshot.dados.protons;

        var n =
          snapshot.neutrons;

        var total = p + n;

        var raioCluster =
          0.070 *
          Math.pow(
            Math.max(total,1),
            1/3
          );

        var raioNucleon =
          total > 120
            ? 0.050
            : total > 60
              ? 0.058
              : 0.070;

        var golden =
          Math.PI *
          (3 - Math.sqrt(5));

        var tipos = [];
        var pRest = p;
        var nRest = n;

        while (
          pRest > 0 ||
          nRest > 0
        ) {
          if (pRest > 0) {
            tipos.push("p");
            pRest--;
          }

          if (nRest > 0) {
            tipos.push("n");
            nRest--;
          }
        }

        var posP = [];
        var posN = [];
        var posNAdicionados = [];

        var neutronsReferencia =
          snapshot.dados.neutrons;

        var nVistos = 0;

        for (
          var i = 0;
          i < total;
          i++
        ) {
          var frac =
            (i + 0.5) /
            total;

          var cosTheta =
            1 - 2*frac;

          var sinTheta =
            Math.sqrt(
              Math.max(
                0,
                1 -
                cosTheta*cosTheta
              )
            );

          var phi =
            golden * i;

          var radial =
            raioCluster *
            Math.pow(
              frac,
              1/3
            );

          var pos = [
            Math.cos(phi) *
              sinTheta *
              radial,
            cosTheta *
              radial,
            Math.sin(phi) *
              sinTheta *
              radial
          ];

          if (tipos[i] === "p") {
            posP.push(pos);
          } else {
            nVistos++;

            if (
              nVistos >
              neutronsReferencia
            ) {
              posNAdicionados.push(pos);
            } else {
              posN.push(pos);
            }
          }
        }

        // prótons: azul
        this.criarInstanciasEsfera(
          parent,
          posP,
          raioNucleon,
          0x55aaff
        );

        // nêutrons originais: amarelo
        this.criarInstanciasEsfera(
          parent,
          posN,
          raioNucleon,
          0xffe066
        );

        // nêutron(s) acrescentado(s): amarelo mais escuro
        this.criarInstanciasEsfera(
          parent,
          posNAdicionados,
          raioNucleon,
          0xc99a00
        );
      },

      criarCamadas: function (
        snapshot,
        parent
      ) {
        var raios = [
          0.48,
          0.76,
          1.05,
          1.32,
          1.58,
          1.82,
          2.04
        ];

        var inclinacoes = [
          {x:15,y:0,z:8},
          {x:68,y:10,z:28},
          {x:38,y:58,z:-18},
          {x:72,y:42,z:11},
          {x:28,y:72,z:32},
          {x:58,y:24,z:-32},
          {x:81,y:15,z:45}
        ];

        var velocidades = [
          55,-39,29,-23,19,-16,13
        ];

        var registros = [];

        var faixa =
          this.faixaCargas(
            snapshot.dados
          );

        var podeRemover =
          this.modoQuimico === "ion" &&
          snapshot.carga < faixa.max;

        var extraEletrons =
          Math.max(
            0,
            snapshot.eletrons -
            snapshot.dados.eletrons
          );

        var destacarAdicionado =
          this.modoQuimico === "ion" &&
          this.ultimoMovimentoEletron ===
            "adicionado";

        var camadaExterna =
          snapshot.camadas.length - 1;

        for (
          var s = 0;
          s < snapshot.camadas.length;
          s++
        ) {
          var qtd =
            snapshot.camadas[s];

          var tilt =
            document.createElement(
              "a-entity"
            );

          parent.appendChild(tilt);

          var rotor =
            document.createElement(
              "a-entity"
            );

          tilt.appendChild(rotor);

          var ringGeo =
            new THREE.TorusGeometry(
              raios[s],
              0.008,
              16,
              192
            );

          var ringMat =
            new THREE.MeshStandardMaterial({
              color: 0xffffff,
              transparent: true,
              opacity: 0.62,
              roughness: 0.32,
              metalness: 0.04
            });

          rotor.object3D.add(
            new THREE.Mesh(
              ringGeo,
              ringMat
            )
          );

          var posNormal = [];
          var posRemovivel = [];
          var posAdicionado = [];

          for (
            var j = 0;
            j < qtd;
            j++
          ) {
            var a =
              (Math.PI*2*j/qtd) +
              s*0.37;

            var pos = [
              Math.cos(a)*raios[s],
              Math.sin(a)*raios[s],
              0
            ];

            var ehExterna =
              s === camadaExterna;

            var ehAdicionado =
              false;

            if (ehExterna) {
              if (
                extraEletrons > 0 &&
                j >=
                  qtd -
                  extraEletrons
              ) {
                ehAdicionado = true;
              } else if (
                destacarAdicionado &&
                j === qtd - 1
              ) {
                // Também destaca o elétron devolvido a um cátion,
                // mesmo quando o total retorna ao átomo neutro.
                ehAdicionado = true;
              }
            }

            if (ehAdicionado) {
              posAdicionado.push(pos);
            } else if (
              ehExterna &&
              podeRemover &&
              j === qtd - 1
            ) {
              posRemovivel.push(pos);
            } else {
              posNormal.push(pos);
            }
          }

          // elétron padrão: vermelho
          this.criarInstanciasEsfera(
            rotor,
            posNormal,
            0.056,
            0xff5a5a,
            0x7c1717
          );

          // candidato à remoção: vermelho mais claro
          this.criarInstanciasEsfera(
            rotor,
            posRemovivel,
            0.060,
            0xffb0b0,
            0x8d4444
          );

          // elétron adicionado: vermelho mais escuro
          this.criarInstanciasEsfera(
            rotor,
            posAdicionado,
            0.060,
            0xa51f1f,
            0x5a0909
          );

          registros.push({
            tilt: tilt,
            rotor: rotor,
            inclinacao:
              inclinacoes[s],
            velocidade:
              velocidades[s],
            angulo: 0
          });
        }

        return registros;
      },

      criarVisual: function (
        snapshot,
        labelText
      ) {
        var root =
          document.createElement(
            "a-entity"
          );

        var content =
          document.createElement(
            "a-entity"
          );

        root.appendChild(content);

        this.criarNucleo(
          snapshot,
          content
        );

        var camadas =
          this.criarCamadas(
            snapshot,
            content
          );

        var label =
          document.createElement(
            "a-text"
          );

        label.setAttribute(
          "value",
          labelText || ""
        );

        label.setAttribute(
          "align",
          "center"
        );

        label.setAttribute(
          "color",
          "#ffffff"
        );

        label.setAttribute(
          "width",
          "1.75"
        );

        label.setAttribute(
          "visible",
          false
        );

        root.appendChild(label);

        return {
          root: root,
          content: content,
          label: label,
          camadas: camadas,
          snapshot: snapshot
        };
      },

      configurarCamadasVisual: function (
        visual
      ) {
        if (!visual) return;

        for (
          var i = 0;
          i < visual.camadas.length;
          i++
        ) {
          var c =
            visual.camadas[i];

          if (this.modoPlano) {
            c.tilt.object3D
              .rotation
              .set(0,0,0);
          } else {
            c.tilt.object3D
              .rotation
              .set(
                THREE.Math.degToRad(
                  c.inclinacao.x
                ),
                THREE.Math.degToRad(
                  c.inclinacao.y
                ),
                THREE.Math.degToRad(
                  c.inclinacao.z
                )
              );
          }
        }
      },

      tick: function (
        time,
        delta
      ) {
        if (!delta) return;

        var ativos =
          this.visuaisAtivos();

        for (
          var a = 0;
          a < ativos.length;
          a++
        ) {
          var visual =
            ativos[a];

          for (
            var i = 0;
            i < visual.camadas.length;
            i++
          ) {
            var c =
              visual.camadas[i];

            if (!this.modoPlano) {
              c.angulo +=
                THREE.Math.degToRad(
                  c.velocidade *
                  delta /
                  1000
                );

              c.rotor.object3D
                .rotation.z =
                c.angulo;
            } else {
              c.rotor.object3D
                .rotation.z = 0;
            }
          }
        }
      },

      visuaisAtivos: function () {
        if (this.comparacao) {
          var a = [];

          if (this.primeiroVisual) {
            a.push(
              this.primeiroVisual
            );
          }

          if (this.segundoVisual) {
            a.push(
              this.segundoVisual
            );
          }

          return a;
        }

        return this.currentVisual
          ? [this.currentVisual]
          : [];
      },

      aplicarTransformacao: function (
        visual,
        escala
      ) {
        if (!visual) return;

        visual.content.object3D
          .scale.set(
            escala,
            escala,
            escala
          );

        visual.content.object3D
          .rotation.set(
            THREE.Math.degToRad(
              this.rotX
            ),
            THREE.Math.degToRad(
              this.rotY
            ),
            0
          );
      },

      atualizarTransformacoes: function () {
        if (this.comparacao) {
          var s =
            0.43 *
            this.zoomComparacao;

          this.aplicarTransformacao(
            this.primeiroVisual,
            s
          );

          this.aplicarTransformacao(
            this.segundoVisual,
            s
          );
        } else {
          this.aplicarTransformacao(
            this.currentVisual,
            this.zoomNormal
          );
        }
      },

      rotacionarAtivos: function (
        dx,
        dy
      ) {
        this.rotY += dx;
        this.rotX =
          clamp(
            this.rotX + dy,
            -80,
            80
          );

        this.atualizarTransformacoes();
      },

      zoomAtivos: function (fator) {
        if (
          !isFinite(fator) ||
          fator <= 0
        ) return;

        if (this.comparacao) {
          this.zoomComparacao =
            clamp(
              this.zoomComparacao *
              fator,
              0.62,
              1.48
            );
        } else {
          this.zoomNormal =
            clamp(
              this.zoomNormal *
              fator,
              0.45,
              1.65
            );
        }

        this.atualizarTransformacoes();
      },

      removerVisual: function (
        visual
      ) {
        if (
          visual &&
          visual.root &&
          visual.root.parentNode
        ) {
          visual.root.parentNode
            .removeChild(
              visual.root
            );
        }
      },

      mostrarElementoNormal: function (
        dados,
        preservarEstado
      ) {
        this.comparacao = false;
        this.aguardandoSegundo = false;

        this.removerVisual(
          this.currentVisual
        );

        this.removerVisual(
          this.primeiroVisual
        );

        this.removerVisual(
          this.segundoVisual
        );

        this.primeiroVisual = null;
        this.segundoVisual = null;
        this.primeiroSnapshot = null;

        var mudouElemento =
          !this.currentData ||
          this.currentData.id !==
            dados.id;

        this.currentData = dados;

        if (
          mudouElemento &&
          !preservarEstado
        ) {
          this.cargaAtual = 0;

          // Só entra em modo isótopos quando
          // existem dados de meia-vida cadastrados.
          this.modoQuimico = null;
          this.ultimoMovimentoEletron = null;
        }

        var snap =
          this.snapshotAtual();

        var visual =
          this.criarVisual(
            snap,
            ""
          );

        this.viewer.appendChild(
          visual.root
        );

        this.currentVisual =
          visual;

        visual.root.setAttribute(
          "position",
          "0 0 0"
        );

        visual.label.setAttribute(
          "visible",
          false
        );

        this.viewer.setAttribute(
          "position",
          "0 0 -2.5"
        );

        // Novo elemento: inicia menor e centralizado.
        // Mudança de íon/isótopo no mesmo átomo: preserva zoom e rotação.
        if (!preservarEstado) {
          this.rotX = 0;
          this.rotY = 0;
          this.zoomNormal = 0.58;
        }

        this.configurarCamadasVisual(
          visual
        );

        this.atualizarTransformacoes();
        this.atualizarUI();

        document.querySelector(
          "#barra-comparacao"
        ).style.display = "none";

        document.querySelector(
          "#barra-principal"
        ).style.display = "flex";

        mostrarToast(
          dados.nome +
          " (" +
          dados.simbolo +
          ") identificado",
          1200
        );
      },

      receberMarcador: function (
        id
      ) {
        var dados =
          porId(id);

        if (!dados) return;

        this.viewer.setAttribute(
          "visible",
          true
        );

        if (
          this.aguardandoSegundo
        ) {
          if (
            this.primeiroSnapshot &&
            dados.id ===
              this.primeiroSnapshot
                .dados.id
          ) {
            mostrarToast(
              "Leia um elemento diferente para comparar",
              1500
            );

            return;
          }

          this.colocarSegundo(
            dados
          );

          return;
        }

        if (
          this.comparacao
        ) {
          if (
            dados.id ===
            this.primeiroSnapshot
              .dados.id
          ) {
            return;
          }

          // Em comparação, qualquer novo marcador
          // substitui o átomo inferior.
          this.colocarSegundo(
            dados
          );

          return;
        }

        // Fora do modo comparação:
        // QUALQUER barcode troca imediatamente
        // o elemento atual.
        this.mostrarElementoNormal(
          dados,
          false
        );
      },

      iniciarComparacao: function () {
        if (
          !this.currentData ||
          !this.currentVisual
        ) return;

        this.primeiroSnapshot =
          this.snapshotAtual();

        this.removerVisual(
          this.currentVisual
        );

        this.currentVisual = null;

        this.primeiroVisual =
          this.criarVisual(
            this.primeiroSnapshot,
            this.labelComparacao(
              this.primeiroSnapshot
            )
          );

        this.viewer.appendChild(
          this.primeiroVisual.root
        );

        this.primeiroVisual.root
          .setAttribute(
            "position",
            "0 1.00 0"
          );

        this.primeiroVisual.label
          .setAttribute(
            "position",
            "0 0.72 0"
          );

        this.primeiroVisual.label
          .setAttribute(
            "visible",
            true
          );

        this.comparacao = true;
        this.aguardandoSegundo = true;

        this.viewer.setAttribute(
          "position",
          "0 0 -4.3"
        );

        this.zoomComparacao = 1;
        this.rotX = 0;
        this.rotY = 0;

        this.configurarCamadasVisual(
          this.primeiroVisual
        );

        this.atualizarTransformacoes();

        document.querySelector(
          "#barra-principal"
        ).style.display = "none";

        document.querySelector(
          "#controles-quimicos"
        ).style.display = "none";

        document.querySelector(
          "#painel-explorar"
        ).style.display = "none";

        document.querySelector(
          "#barra-comparacao"
        ).style.display = "flex";

        mostrarToast(
          this.primeiroSnapshot
            .dados.nome +
          " fixado acima • leia outro barcode",
          2400
        );
      },

      colocarSegundo: function (
        dados
      ) {
        this.removerVisual(
          this.segundoVisual
        );

        var snap =
          this.snapshotPadrao(
            dados
          );

        this.segundoVisual =
          this.criarVisual(
            snap,
            this.labelComparacao(
              snap
            )
          );

        this.viewer.appendChild(
          this.segundoVisual.root
        );

        this.segundoVisual.root
          .setAttribute(
            "position",
            "0 -1.00 0"
          );

        this.segundoVisual.label
          .setAttribute(
            "position",
            "0 0.72 0"
          );

        this.segundoVisual.label
          .setAttribute(
            "visible",
            true
          );

        this.aguardandoSegundo = false;
        this.comparacao = true;

        this.configurarCamadasVisual(
          this.segundoVisual
        );

        this.atualizarTransformacoes();

        mostrarToast(
          this.primeiroSnapshot
            .dados.simbolo +
          " × " +
          dados.simbolo,
          1300
        );
      },

      labelComparacao: function (
        snap
      ) {
        return (
          snap.dados.simbolo +
          "  •  Z" +
          snap.dados.numeroAtomico +
          "  •  A" +
          snap.numeroMassa
        );
      },

      sairComparacao: function () {
        var volta =
          this.primeiroSnapshot
            ? this.primeiroSnapshot.dados
            : this.currentData;

        this.removerVisual(
          this.primeiroVisual
        );

        this.removerVisual(
          this.segundoVisual
        );

        this.primeiroVisual = null;
        this.segundoVisual = null;

        this.comparacao = false;
        this.aguardandoSegundo = false;

        this.viewer.setAttribute(
          "position",
          "0 0 -2.5"
        );

        if (volta) {
          this.mostrarElementoNormal(
            volta,
            true
          );
        }
      },

      mudarIsotopo: function (
        passo
      ) {
        if (
          !this.currentData ||
          !this.currentData.isotopos
        ) return;

        var novo =
          this.naIsotopoIndex +
          passo;

        if (
          novo < 0 ||
          novo >=
            this.currentData
              .isotopos.length
        ) return;

        this.naIsotopoIndex =
          novo;

        var d =
          this.currentData;

        this.mostrarElementoNormal(
          d,
          true
        );

        var iso =
          d.isotopos[
            this.naIsotopoIndex
          ];

        mostrarToast(
          iso.nome +
          " • " +
          iso.estabilidade,
          1350
        );
      },

      mudarEletrons: function (
        passo
      ) {
        if (!this.currentData) return;

        var faixa =
          this.faixaCargas(
            this.currentData
          );

        // −e => carga aumenta em +1
        // +e => carga diminui em −1
        var novaCarga =
          this.cargaAtual -
          passo;

        if (
          novaCarga < faixa.min ||
          novaCarga > faixa.max
        ) {
          return;
        }

        this.cargaAtual =
          novaCarga;

        this.ultimoMovimentoEletron =
          passo > 0
            ? "adicionado"
            : "removido";

        var d =
          this.currentData;

        this.mostrarElementoNormal(
          d,
          true
        );

        var comum =
          this.cargaEhComum(
            d,
            this.cargaAtual
          );

        mostrarToast(
          this.simboloIon(
            d,
            this.cargaAtual
          ) +
          (
            comum
              ? " • estado comum/referenciado"
              : " • estado intermediário didático"
          ),
          1500
        );
      },

      atualizarUI: function () {
        if (!this.currentData) return;

        var dados =
          this.currentData;

        var explorar =
          document.querySelector(
            "#btn-explorar"
          );

        explorar.textContent =
          "☰ Explorar " +
          dados.simbolo;

        document.querySelector(
          "#titulo-explorar"
        ).textContent =
          "Explorar " +
          dados.nome +
          " (" +
          dados.simbolo +
          ")";

        var controles =
          document.querySelector(
            "#controles-quimicos"
          );

        var bMenos =
          document.querySelector(
            "#btn-menos"
          );

        var bMais =
          document.querySelector(
            "#btn-mais"
          );

        controles.style.display =
          "none";

        var temIsotopos =
          !!(
            dados.isotopos &&
            dados.isotopos.length
          );

        var faixa =
          this.faixaCargas(
            dados
          );

        var temIons =
          faixa.min < 0 ||
          faixa.max > 0;

        var btnMenuIsotopos =
          document.querySelector(
            "#btn-menu-isotopos"
          );

        var btnMenuIons =
          document.querySelector(
            "#btn-menu-ions"
          );

        btnMenuIsotopos.style.display =
          this.modoPlano && temIsotopos
            ? "block"
            : "none";

        btnMenuIons.style.display =
          this.modoPlano && temIons
            ? "block"
            : "none";

        if (
          this.modoQuimico ===
            "isotopo" &&
          temIsotopos
        ) {
          bMenos.textContent =
            "−n";

          bMais.textContent =
            "+n";

          bMenos.disabled =
            this.naIsotopoIndex === 0;

          bMais.disabled =
            this.naIsotopoIndex ===
            dados.isotopos.length - 1;

          controles.style.display =
            "flex";
        }

        if (
          this.modoQuimico ===
            "ion" &&
          temIons
        ) {
          bMenos.textContent =
            "−e";

          bMais.textContent =
            "+e";

          bMenos.disabled =
            this.cargaAtual >=
              faixa.max;

          bMais.disabled =
            this.cargaAtual <=
              faixa.min;

          controles.style.display =
            "flex";
        }

        bMenos.style.opacity =
          bMenos.disabled
            ? "0.35"
            : "1";

        bMais.style.opacity =
          bMais.disabled
            ? "0.35"
            : "1";

        document.querySelector(
          "#btn-modo-camadas"
        ).textContent =
          this.modoPlano
            ? "◉ Voltar ao 3D"
            : "▣ Camadas planas";
      },

          secao(
            "Estrutura eletrônica"
          ) +
          linha(
            "Distribuição por camadas",
            d.distribuicao
          ) +
          linha(
            "Configuração completa",
            f.configuracaoCompleta ||
            d.configuracao
          ) +
          linha(
            "Configuração condensada",
            f.configuracaoCondensada ||
            "—"
          ) +
          linha(
            "Elétrons de valência",
            f.eletronsValencia ||
            "—"
          ) +

          secao(
            "Posição na Tabela Periódica"
          ) +
          linha(
            "Grupo",
            d.grupo
          ) +
          linha(
            "Período",
            d.periodo
          ) +
          linha(
            "Bloco",
            d.bloco
          ) +
          linha(
            "Classificação",
            d.classificacao
          ) +
          linha(
            "Íon de referência",
            d.ionComum
          );

        document.querySelector(
          "#info-corpo"
        ).innerHTML =
          html;

        var obs =
          document.querySelector(
            "#info-observacao"
          );

        if (
          f.observacaoMassa
        ) {
          obs.innerHTML =
            "<strong>Observação</strong><br>" +
            f.observacaoMassa;

          obs.style.display =
            "block";
        } else {
          obs.textContent =
            "";

          obs.style.display =
            "none";
        }

        this.prepararPainelInfo();
        this.fecharExplorar();
      },

      abrirCuriosidades: function () {
        if (!this.currentData) return;

        var d =
          this.currentData;

        var lista =
          d.curiosidades || [];

        document.querySelector(
          "#info-tipo"
        ).textContent =
          "💡 CURIOSIDADES";

        document.querySelector(
          "#info-nome"
        ).textContent =
          "Curiosidades sobre " +
          d.nome;

        document.querySelector(
          "#info-simbolo"
        ).textContent =
          "";

        var html = "";

        if (!lista.length) {
          html =
            "<div style='" +
            "padding:18px 0;" +
            "font-size:18px;" +
            "line-height:1.5'>" +
            "Ainda não há curiosidades cadastradas para este elemento." +
            "</div>";
        } else {
          lista.forEach(
            function (c, i) {
              html +=
                "<div style='" +
                "padding:16px 0;" +
                (
                  i < lista.length - 1
                    ? "border-bottom:1px solid rgba(255,255,255,.34);"
                    : ""
                ) +
                "'>" +

                "<div style='" +
                "font-size:19px;" +
                "font-weight:700;" +
                "line-height:1.28;" +
                "margin-bottom:6px'>" +
                (c.icone || "•") +
                " " +
                (c.titulo || ("Curiosidade " + (i+1))) +
                "</div>" +

                "<div style='" +
                "font-size:17px;" +
                "line-height:1.52'>" +
                (c.texto || "") +
                "</div>" +

                "</div>";
            }
          );
        }

        document.querySelector(
          "#info-corpo"
        ).innerHTML =
          html;

        var obs =
          document.querySelector(
            "#info-observacao"
          );

        if (
          d.perguntaObservacao
        ) {
          obs.innerHTML =
            "<strong style='font-size:18px'>🔎 Observe e responda</strong><br><br>" +
            d.perguntaObservacao;

          obs.style.display =
            "block";
        } else {
          obs.textContent =
            "";

          obs.style.display =
            "none";
        }

        this.prepararPainelInfo();
        this.fecharExplorar();
      },

      ouvirDescricao: function () {
        if (!this.currentData) return;

        var caminho =
          this.currentData.audio;

        this.fecharExplorar();

        if (!caminho) {
          mostrarToast(
            "Este elemento ainda não possui áudio cadastrado.",
            1700
          );

          return;
        }

        if (this.audioAtual) {
          try {
            this.audioAtual.pause();
          } catch (e) {}
        }

        var self = this;
        var audio =
          new Audio(caminho);

        this.audioAtual =
          audio;

        audio.play()
          .then(function () {
            mostrarToast(
              "Reproduzindo descrição de " +
              self.currentData.nome,
              1300
            );
          })
          .catch(function () {
            mostrarToast(
              "Áudio ainda não disponível neste repositório.",
              1900
            );
          });
      },

      ativarModoIsotopos: function () {
        if (!this.currentData) return;

        if (!this.modoPlano) {
          this.fecharExplorar();

          mostrarToast(
            "Isótopos disponíveis apenas no modo plano.",
            1700
          );

          return;
        }

        if (
          !this.currentData.isotopos ||
          !this.currentData.isotopos.length
        ) {
          this.fecharExplorar();

          mostrarToast(
            "Banco de isótopos ainda não cadastrado para " +
            this.currentData.simbolo +
            ".",
            1900
          );

          return;
        }

        this.modoQuimico =
          "isotopo";

        this.ultimoMovimentoEletron =
          null;

        this.mostrarElementoNormal(
          this.currentData,
          true
        );

        this.fecharExplorar();

        mostrarToast(
          "Modo isótopos • use +n / −n",
          1400
        );
      },

      ativarModoIons: function () {
        if (!this.currentData) return;

        if (!this.modoPlano) {
          this.fecharExplorar();

          mostrarToast(
            "Íons disponíveis apenas no modo plano.",
            1700
          );

          return;
        }

        var faixa =
          this.faixaCargas(
            this.currentData
          );

        if (
          faixa.min === 0 &&
          faixa.max === 0
        ) {
          this.fecharExplorar();

          mostrarToast(
            "Sem estado iônico monoatômico de referência cadastrado.",
            1800
          );

          return;
        }

        this.modoQuimico =
          "ion";

        this.ultimoMovimentoEletron =
          null;

        this.mostrarElementoNormal(
          this.currentData,
          true
        );

        this.fecharExplorar();

        mostrarToast(
          "Modo íons • elétron claro = candidato à remoção",
          1700
        );
      },

      alternarVisualizacao: function () {
        this.modoPlano =
          !this.modoPlano;

        if (
          !this.modoPlano &&
          (
            this.modoQuimico === "isotopo" ||
            this.modoQuimico === "ion"
          )
        ) {
          this.modoQuimico = null;
          this.cargaAtual = 0;
          this.naIsotopoIndex = 0;
          this.ultimoMovimentoEletron = null;

          if (this.currentData) {
            this.mostrarElementoNormal(
              this.currentData,
              true
            );
          }

          mostrarToast(
            "Modo 3D • íons e isótopos ficam disponíveis só no modo plano",
            1800
          );

          return;
        }

        var ativos =
          this.visuaisAtivos();

        var self = this;

        ativos.forEach(
          function (v) {
            self.configurarCamadasVisual(
              v
            );
          }
        );

        this.atualizarUI();

        document.querySelector(
          "#btn-plano-comparacao"
        ).textContent =
          this.modoPlano
            ? "◉ 3D"
            : "▣ Plano";

        mostrarToast(
          this.modoPlano
            ? "Camadas planas • íons e isótopos liberados"
            : "Modo 3D",
          1100
        );
      },

      configurarUI: function () {
        var self = this;

        document.querySelector(
          "#btn-explorar"
        ).addEventListener(
          "click",
          function () {
            var p =
              document.querySelector(
                "#painel-explorar"
              );

            p.style.display =
              p.style.display === "block"
                ? "none"
                : "block";
          }
        );

        document.querySelector(
          "#btn-fechar-explorar"
        ).addEventListener(
          "click",
          function () {
            self.fecharExplorar();
          }
        );

        document.querySelector(
          "#btn-ficha"
        ).addEventListener(
          "click",
          function () {
            self.abrirFichaCompleta();
          }
        );

        document.querySelector(
          "#btn-curiosidades"
        ).addEventListener(
          "click",
          function () {
            self.abrirCuriosidades();
          }
        );

        document.querySelector(
          "#btn-audio"
        ).addEventListener(
          "click",
          function () {
            self.ouvirDescricao();
          }
        );

        document.querySelector(
          "#btn-menu-isotopos"
        ).addEventListener(
          "click",
          function () {
            self.ativarModoIsotopos();
          }
        );

        document.querySelector(
          "#btn-menu-ions"
        ).addEventListener(
          "click",
          function () {
            self.ativarModoIons();
          }
        );

        document.querySelector(
          "#btn-modo-camadas"
        ).addEventListener(
          "click",
          function () {
            self.alternarVisualizacao();
            self.fecharExplorar();
          }
        );

        document.querySelector(
          "#btn-menos"
        ).addEventListener(
          "click",
          function () {
            if (
              self.modoQuimico ===
              "isotopo"
            ) {
              self.mudarIsotopo(-1);
            } else if (
              self.modoQuimico ===
              "ion"
            ) {
              self.mudarEletrons(-1);
            }
          }
        );

        document.querySelector(
          "#btn-mais"
        ).addEventListener(
          "click",
          function () {
            if (
              self.modoQuimico ===
              "isotopo"
            ) {
              self.mudarIsotopo(1);
            } else if (
              self.modoQuimico ===
              "ion"
            ) {
              self.mudarEletrons(1);
            }
          }
        );

        document.querySelector(
          "#btn-fechar-info"
        ).addEventListener(
          "click",
          function () {
            document.querySelector(
              "#painel-info"
            ).style.display =
              "none";
          }
        );

        var painelInfo =
          document.querySelector(
            "#painel-info"
          );

        [
          "touchstart",
          "touchmove",
          "touchend"
        ].forEach(function (evento) {
          painelInfo.addEventListener(
            evento,
            function (ev) {
              ev.stopPropagation();
            },
            {passive:true}
          );
        });


        document.querySelector(
          "#btn-plano-comparacao"
        ).addEventListener(
          "click",
          function () {
            self.alternarVisualizacao();
          }
        );

        document.querySelector(
          "#btn-comparar"
        ).addEventListener(
          "click",
          function () {
            self.fecharExplorar();
            self.iniciarComparacao();
          }
        );

        document.querySelector(
          "#btn-sair-comparacao"
        ).addEventListener(
          "click",
          function () {
            self.sairComparacao();
          }
        );
      }
    });
  </script>

  <a-scene
    vr-mode-ui="enabled:false;"
    loading-screen="enabled:false;"
    renderer="logarithmicDepthBuffer:true;"
    arjs="trackingMethod:best; sourceType:webcam; detectionMode:mono_and_matrix; matrixCodeType:4x4_BCH_13_9_3; debugUIEnabled:false;"
    embedded
    gerenciador-marcadores
    gestos-laboratorio>

    <a-entity camera>
      <a-entity
        id="viewer"
        visible="false"
        position="0 0 -2.5"
        laboratorio-v2>
      </a-entity>
    </a-entity>
  </a-scene>

</body>
</html>
